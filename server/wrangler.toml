# MarketPeek 시세 서버 (Cloudflare Workers 무료 플랜).
# 1시간마다 환율을 받아 KV에 캐시하고, 앱은 GET /quotes로 캐시된 값만 읽는다.
# 주식 시세는 앱이 한국투자증권 Open API에서 사용자 키로 직접 받는다.
name = "marketpeek-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[triggers]
# 무료 플랜 KV 쓰기 한도는 하루 1,000회. 환율 1시간마다 1회 = 하루 24회.
crons = ["0 * * * *"]

[[kv_namespaces]]
binding = "QUOTES"
# `npx wrangler kv namespace create QUOTES`로 만든 id (계정마다 다름).
id = "ab992677e1c5453883ef5e7eaa2ca8fa"

[vars]
# 캐시할 통화. 앱 lib/data/catalog.dart 목록과 맞춘다.
FX_CODES = "USD,JPY,EUR,THB,CNY"

# 비밀 키는 여기 적지 않는다. 배포용: npx wrangler secret put EXIM_API_KEY
# 로컬용: .dev.vars 파일 (git에 올리지 않음, .dev.vars.example 참고)
